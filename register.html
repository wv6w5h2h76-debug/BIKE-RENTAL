<body data-page="register" data-loading-label="LOADING">
    <!-- RYVON Reusable Preloader Component -->
    <div id="ryvon-loader" class="ryvon-loader" aria-live="polite" aria-label="Loading RYVON">
      <script>
        (function() {
          // Immediately apply theme class to prevent white flash before JS loads
          var theme = localStorage.getItem('rideos-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') {
            document.body.classList.add('dark');
          }
          
          var isHome = document.body.dataset.page === 'home';
          var labelText = document.body.dataset.loadingLabel || 'LOADING';
          var inPages = window.location.pathname.replace(/\\/g, '/').includes('/pages/');
          var bikeImgUrl = (inPages ? '../' : '') + 'assets/images/ryvon-superbike.png';
          
          var loader = document.getElementById('ryvon-loader');
          if (isHome) {
            loader.classList.add('is-home');
          } else {
            loader.classList.add('is-subpage');
          }
          
          var contentHtml = '<div class="ryvon-loader-content">' +
            '<div class="ryvon-loader-bike-wrap">' +
              '<img src="' + bikeImgUrl + '" class="ryvon-loader-bike-trail trail-3" alt="" aria-hidden="true">' +
              '<img src="' + bikeImgUrl + '" class="ryvon-loader-bike-trail trail-2" alt="" aria-hidden="true">' +
              '<img src="' + bikeImgUrl + '" class="ryvon-loader-bike-trail trail-1" alt="" aria-hidden="true">' +
              '<img src="' + bikeImgUrl + '" class="ryvon-loader-bike" alt="RYVON Superbike">' +
              '<div class="ryvon-loader-streaks">' +
                '<span class="ryvon-streak streak-1"></span>' +
                '<span class="ryvon-streak streak-2"></span>' +
                '<span class="ryvon-streak streak-3"></span>' +
              '</div>' +
              '<div class="ryvon-loader-shadow"></div>' +
            '</div>' +
            '<div class="ryvon-loader-glow-container">' +
              '<div class="ryvon-loader-glow-beam"></div>' +
            '</div>';

          if (isHome) {
            contentHtml += '<h1 class="ryvon-loader-wordmark">RYVON</h1>' +
                           '<p class="ryvon-loader-sublabel">' + labelText + '</p>';
          } else {
            contentHtml += '<p class="ryvon-loader-sublabel is-subpage">' + labelText + '</p>';
          }
          
          contentHtml += '</div>';
          loader.innerHTML = contentHtml;

          // Safety failsafe: ensure preloader never hangs indefinitely
          setTimeout(function() {
            var l = document.getElementById('ryvon-loader');
            if (l && !l.classList.contains('fade-out')) {
              l.classList.add('fade-out');
              setTimeout(function() { if (l && l.parentNode) l.remove(); }, 600);
            }
          }, 3500);
        })();
      </script>
    </div>
